name: clinic_app
description: "Clinic & lab management app for Saudi Arabia (Arabic RTL first)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  iconsax_flutter: ^1.0.1
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  cached_network_image: ^3.4.1
  share_plus: ^12.0.2
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
